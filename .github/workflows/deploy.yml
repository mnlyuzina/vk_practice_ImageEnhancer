name: Deploy demo to GitHub Pages

on:
  push:
    branches: [ "main" ]   # если ваша основная ветка называется "master", замените

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vite build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - uses: actions/deploy-pages@v4